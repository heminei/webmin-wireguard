name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check the tag matches module.info
        run: |
          version=$(sed -n 's/^version=//p' module.info)
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "Tag $GITHUB_REF_NAME does not match module.info version $version"
            exit 1
          fi

      - name: Build the package
        run: ./package.sh wireguard.wbm.gz

      - name: Publish the release
        uses: softprops/action-gh-release@v2
        with:
          files: wireguard.wbm.gz
          generate_release_notes: true
