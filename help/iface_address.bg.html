<header>Адрес</header>
IP адресът на този сървър във VPN-а, следван от дължината на префикса, например
<tt>10.0.0.1/24</tt>. За използване на IPv4 и IPv6 едновременно разделете
адресите със запетаи.<p>
Това определя и VPN подмрежата. На новите peer-ове автоматично се дава
следващият свободен адрес от IPv4 подмрежата.
