<header>MTU</header>
Най-големият размер на пакет, използван от интерфейса. Ако е оставен по
подразбиране, <tt>wg-quick</tt> избира подходяща стойност, обикновено 1420.<p>
Намалете го, ако връзките "заспиват" или големи трансфери увисват, което се
случва при връзки с допълнителен overhead, като PPPoE.
