<header>PostDown команди</header>
Shell команди, изпълнявани с root права от <tt>wg-quick</tt> точно след като
интерфейсът е спрян. Въведете по една команда на ред. <tt>%i</tt> се заменя с
името на интерфейса.<p>
Използвайте ги, за да премахнете правилата на firewall и NAT, добавени от
PostUp командите.
